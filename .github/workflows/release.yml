name: Release

# Triggered by `make release` (which pushes the vX.Y.Z tag), or manually.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify tag matches source version
        run: |
          VERSION=$(python scripts/bump_version.py --current)
          TAG=${GITHUB_REF_NAME#v}
          echo "source=$VERSION tag=$TAG"
          test "$VERSION" = "$TAG" || {
            echo "::error::Tag $TAG does not match ansiblecli/__init__.py version $VERSION";
            exit 1;
          }

      - name: Test
        run: pytest

      - name: Build distributions
        run: python -m build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
